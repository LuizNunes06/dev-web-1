<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Galeria Imagens</title>
  </head>
  <body>
    <main>
      <section>
        <div>
          <p></p>
          <img src="" class="img-principal" alt="img-principal" />
        </div>
        <span class="listagem"> </span>
      </section>
    </main>
  </body>
  <style>
    * {
      padding: 0;
      margin: 0;
    }

    main {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    section {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    img.img-principal {
      width: 100%;
    }
    
    section > div {
      position: relative;
      width: 68vw;

      & p{
        position: absolute;
        bottom: 5px;
        padding: 1vh 1vw;
        
        width: 66vw;
        color: white;
        background-color: rgba(0, 0, 0, 0.384);
        z-index: 10;
       }
    }

  </style>
  <script>
    let imagemPrincipal = document.querySelector("section > div > img");
    let imagensList = document.querySelector(".listagem");

    let imagensMap = [
      {
        alt: "img-0",
        listSrc: "./galeria-imagens/image.png",
        mainSrc: "./fotos-principal/image.png",
        desc: "High hygiene standards",
      },
      {
        alt: "img-1",
        listSrc: "./galeria-imagens/image-1.png",
        mainSrc: "./fotos-principal/image-1.png",
        desc: "Well-Maintained Private Rooms",
      },
      {
        alt: "img-2",
        listSrc: "./galeria-imagens/image-2.png",
        mainSrc: "./fotos-principal/image-2.png",
        desc: "Well-Furbished Shared Rooms",
      },
      {
        alt: "img-3",
        listSrc: "./galeria-imagens/image-3.png",
        mainSrc: "./fotos-principal/image-3.png",
        desc: "State-of-the-art Technology",
      },
      {
        alt: "img-4",
        listSrc: "./galeria-imagens/image-4.png",
        mainSrc: "./fotos-principal/image-4.png",
        desc: "Clean and Well-Maintained Operating Rooms",
      },
      {
        alt: "img-5",
        listSrc: "./galeria-imagens/image-5.png",
        mainSrc: "./fotos-principal/image-5.png",
        desc: "Hospital Interior Space ",
      },
      {
        alt: "img-6",
        listSrc: "./galeria-imagens/image-6.png",
        mainSrc: "./fotos-principal/image-6.png",
        desc: "Same-Day Operating Theatres on Standby",
      },
      {
        alt: "img-7",
        listSrc: "./galeria-imagens/image-7.png",
        mainSrc: "./fotos-principal/image-7.png",
        desc: "Hospital Lobby Reception",
      },
      {
        alt: "img-8",
        listSrc: "./galeria-imagens/image-8.png",
        mainSrc: "./fotos-principal/image-8.png",
        desc: "Clean and safe infrastructure",
      },
      {
        alt: "img-9",
        listSrc: "./galeria-imagens/image-9.png",
        mainSrc: "./fotos-principal/image-9.png",
        desc: "Transportable beds",
      },
    ];

    imagemPrincipal.src = imagensMap[0].mainSrc;
    imagemPrincipal.previousElementSibling.textContent = imagensMap[0].desc

    for (i of imagensMap) {
      let img = document.createElement("img");
      img.src = i.listSrc;
      img.alt = i.alt;
      imagensList.appendChild(img);
    }

    let imagens = document.querySelectorAll(".listagem > img");

    imagens.forEach(function (imagem) {
      imagem.addEventListener("click", function () {
        let indexImg = Number(imagem.alt.replace("img-", ""));
        const img = document.querySelector("div > img") 
        imagemPrincipal.src = imagensMap[indexImg].mainSrc;
        imagemPrincipal.nextElementSibling.textContent = imagensMap[indexImg].desc
      });
    });
  </script>
</html>
