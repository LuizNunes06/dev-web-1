<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TodoList</title>
  </head>
  <body>
    <main>
      <h2>To Do List</h2>
      <section>
        <form action="#">
          <input type="text" required placeholder="Add new task" id="tarefa" />
          <button type="button" type="submit" id="adicionar">Add</button>
        </form>
        <ul id="todoList"></ul>
      </section>
    </main>
    <style>
      * {
        margin: 0;
        padding: 0;
        font-family: "Courier New", Courier, monospace;
        border: none;
        outline: none;
      }

      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background-color: rgb(239, 244, 244);
      }

      h2 {
        font-size: 2rem;
        font-weight: normal;
        margin-bottom: 2vh;
      }

      section {
        background-color: rgb(255, 255, 255);
        border-radius: 5px;
        padding: 2vh 1vw;
        box-shadow: 1px 3px 10px rgb(176, 176, 176);
        min-width: 35vw;
        max-width: 85vw;
      }

      form {
        display: flex;
        justify-content: space-between;

        & input {
          width: 100%;
          padding: 1vh 1vw;
        }

        & button {
          background-color: rgb(49, 145, 255);
          color: white;
          padding: 0 1vw;
          font-weight: bold;
          border-radius: 5px;
          cursor: pointer;
        }
      }

      li {
        display: flex;
        width: 100%;
        justify-content: space-between;
        margin-top: 2vh;

        & span {
          display: flex;
          gap: 1vw;
          font-weight: 100;

          & button {
            background: transparent;
            cursor: pointer;
          }

          & button:first-of-type {
            color: red;
          }

          & button:last-of-type {
            color: rgb(49, 145, 255);
          }

          & input:checked + p {
            text-decoration: line-through;
          }
        }
      }
    </style>

    <script>
      let botao = document.getElementById("adicionar");

      botao.addEventListener("click", function () {
        let campo = document.querySelector("input");
        console.log(campo.value);

        let li = document.createElement("li");

        li.innerHTML = `<span> <input type="checkbox"><p>${campo.value}</p> </span>
        <span><button onclick="remover(this)">Delete</button><button>Edit</button></span>`;

        ul = document.getElementById("todoList");
        ul.appendChild(li);
        campo.value = "";
        campo.focus();
      });

      function remover(elemento) {
        elemento.parentElement.parentElement.remove();
      }
    </script>
  </body>
</html>
