<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora Airbnb</title>
  </head>
  <body>
    <main>
      <section>
        <h2>Calculadora Airbnb</h2>
        <p>Diaria: R$<span id="valorDiaria"></span></p>
        <form action="#">
          <p>
            <label for="checkin"> Check-in: </label>

            <input type="date" id="checkin" />
          </p>
          <p>
            <label for="checkout"> Check-out: </label>
            <input type="date" id="checkout" onchange="calculaReserva()" />
          </p>
          <p>
            <label for="qtdHospedes"> Hóspedes: </label>
            <input
              type="number"
              value="1"
              min="1"
              max="4"
              id="qtdHospedes"
              onchange="calculaReserva()"
            />
          </p>
          <button onclick="calculaReserva()">Reservar</button>

          <p>
            <label for="cupom"> cupom: </label>
            <input type="text" id="cupom" />
          </p>
        </form>
        <p><span id="calculoNoites"></span> <span id="valorNoites"></span></p>
        <p>Taxa de limpeza: R$<span id="valorLimpeza"></span></p>
        <p>Taxa de serviço: R$<span id="valorServico"></span></p>
      </section>
    </main>

    <script>
      const valorDiaria = 510;
      const valorLimpeza = 120;
      const porcServico = 0.15;

      document.getElementById("valorDiaria").textContent = valorDiaria;
      document.getElementById("valorLimpeza").textContent = valorLimpeza;

      function calculaReserva() {
        let checkin = document.getElementById("checkin").value;
        let checkout = document.getElementById("checkout").value;
        let TaxaHospedes = document.getElementById("qtdHospedes").value;
        let cupom = document.getElementById("cupom").value
        let taxaServico = 0


        if (TaxaHospedes > 4) {
          document.getElementById("qtdHospedes").value = 4;
        } else if (TaxaHospedes < 1) {
          document.getElementById("qtdHospedes").value = 1;
        }

        let diasHosp = calculaDias(checkin, checkout);
        valorNoites = valorDiaria * diasHosp;

        taxaHospedes = valorNoites * ((TaxaHospedes - 1) * 0.2);
        taxaServico = (taxaHospedes + valorNoites) * 0.15;

        cupom = cupom.replace("OFF", "")
        
        let valorCupom = 0
        if (Number(cupom) && Number(cupom) < 100 && Number(cupom) >= 0){
          valorCupom = Number(cupom)/ 100
          
          
        }
        
        document.getElementById("valorServico").textContent = `${taxaServico}`;
        
        document.getElementById("calculoNoites").textContent =
          `R$${valorDiaria} x ${diasHosp} noite(s)`;
        document.getElementById("valorNoites").textContent = `R$${valorNoites}`;
      }

      function calculaDias(entrada, saida) {
        let dataEntrada = new Date(entrada);
        let dataSaida = new Date(saida);

        let diferenca = dataSaida - dataEntrada;
        return Math.ceil(diferenca / (1000 * 3600 * 24));
      }
    </script>
  </body>
</html>
