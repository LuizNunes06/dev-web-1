<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portifolio</title>
  </head>

  <body>
    <header>
      <nav>
        <ul>
          <li><a href="./index.html">Home</a></li>
          <li><a href="./about.html">About</a></li>
          <li><a href="./projects.html">Projects</a></li>
          <li><a href="./connect.html">Connect</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <section class="hero">
        <h1><span>About</span> Alex</h1>
        <h2>
          With 5+ years in design, I've worked on diverse projects, from mobile
          apps to web platforms, focusing on user-centered designs that are both
          visually appealing and practical.
        </h2>
      </section>
    </main>

    <style>
      * {
        margin: 0;
        padding: 0;
        border: none;
        list-style: none;
        text-decoration: none;
        color: #1e1e1e;
        font-family:
          "Trebuchet MS", "Lucida Sans Unicode", "Lucida Grande", "Lucida Sans",
          Arial, sans-serif;
      }

      body {
        background-color: #f5f5f5;
      }

      section {
        margin: 3vw 15vw;
      }

      /* Header */
      header nav ul {
        padding: 5px;
        border: 1px solid #e5e5e5;
        display: flex;
        justify-content: center;
        gap: 1vw;
        width: fit-content;
        margin: 2vh auto;
        border-radius: 5vw;

        & li {
          padding: 1vh 1vw;
          border-radius: 5vw;
        }

        & li:nth-of-type(2) {
          background-color: #1e1e1e;

          & a {
            color: white;
          }
        }
      }

      /* Hero */
      section.hero {
        display: flex;
        gap: 5vw;

        & h1 {
          width: 100%;
          font-size: 4rem;
          font-weight: normal;
        }

        & h2 {
          width: 100%;
          font-size: 2.95rem;
          font-weight: normal;
          color: #5a5a5a;
          letter-spacing: 1px;
          text-wrap-style: pretty;

          & span {
            color: #5a5a5a;
          }
        }

        & span {
          font-weight: bold;
        }
      }
    </style>
  </body>
</html>
